name: macOS native build and release verification
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Reuse successful native outputs from this repository's run ID (optional)
        required: false
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-build:
    name: Build and test macOS ${{ matrix.arch }}
    if: ${{ inputs.native_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            arch: x64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-macos-${{ matrix.arch }}-base-declarative-tools-svg-v1
      - name: Install exact Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall==3.3.0
          python tools/install-qt-sdk.py --host mac --output "$RUNNER_TEMP/Qt"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.qt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-macos-${{ matrix.arch }}-base-declarative-tools-svg-v1
      - name: Select installed Qt SDK
        run: echo "QT_MAC_ROOT=$RUNNER_TEMP/Qt/6.11.3/macos" >> "$GITHUB_ENV"
      - name: Build native application and fixtures
        id: compile
        run: |
          cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_MAC_ROOT" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}
          cmake --build build-macos --parallel 3
      - name: Prepare disposable unlocked test Keychain
        run: |
          password="$(python -c 'import secrets;print(secrets.token_hex(32))')"
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/TeamHJD-fixture.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          echo 'TEAMHJD_TEST_KEYCHAIN_READY=1' >> "$GITHUB_ENV"
      - name: Native core and visible GUI startup checks
        run: |
          ctest --test-dir build-macos --output-on-failure -R '^client_experience$'
          keychain="$RUNNER_TEMP/TeamHJD-fixture.keychain-db"
          test -f "$keychain"
          security delete-generic-password -s com.teamhjd.launcher.credentials -a wrap-v1 "$keychain"
          ctest --test-dir build-macos --output-on-failure -R '^connection_status$'
          # Each unsigned native test binary must own its own fixture key. Reusing
          # the wrapping item created by ConnectionTests prompts CoreTests for
          # cross-binary Keychain consent. Remove only that disposable CI item;
          # do not broaden its ACL or suppress the credential assertions.
          keychain="$RUNNER_TEMP/TeamHJD-fixture.keychain-db"
          test -f "$keychain"
          security delete-generic-password -s com.teamhjd.launcher.credentials -a wrap-v1 "$keychain"
          ctest --test-dir build-macos --output-on-failure -E '^(client_experience|connection_status)$'
      - name: Archive the four native build outputs before packaging
        id: archive
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python tools/archive-native-macos.py pack --build build-macos --archive "$RUNNER_TEMP/native-macos/TeamHJD-Native-macOS-${{ matrix.arch }}.zip"
      - name: Retain native outputs independently from packaging
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macOS-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-macos/TeamHJD-Native-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3
      - name: Remove disposable test Keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/TeamHJD-fixture.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

  native-package:
    name: Package and verify macOS ${{ matrix.arch }}
    needs: native-build
    if: ${{ !cancelled() && (needs.native-build.result == 'success' || (needs.native-build.result == 'skipped' && inputs.native_run_id != '')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            arch: x64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate upstream native source and successful build jobs
        id: reuse
        if: ${{ inputs.native_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_REUSE_RUN_ID: ${{ inputs.native_run_id }}
        run: python tools/validate-native-macos-reuse.py --run-id "$NATIVE_REUSE_RUN_ID" --repository "$GITHUB_REPOSITORY" --current-sha "$GITHUB_SHA" --proof "$RUNNER_TEMP/native-reuse-result.json"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-macos-${{ matrix.arch }}-base-declarative-tools-svg-v1
      - name: Install exact Qt SDK if the cache is unavailable
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall==3.3.0
          python tools/install-qt-sdk.py --host mac --output "$RUNNER_TEMP/Qt"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.qt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-macos-${{ matrix.arch }}-base-declarative-tools-svg-v1
      - name: Select installed Qt SDK
        run: echo "QT_MAC_ROOT=$RUNNER_TEMP/Qt/6.11.3/macos" >> "$GITHUB_ENV"
      - name: Download this run's native outputs for the same architecture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macOS-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-macos
          repository: ${{ github.repository }}
          run-id: ${{ steps.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore only the four owned native build outputs
        run: python tools/archive-native-macos.py extract --archive "$RUNNER_TEMP/native-macos/TeamHJD-Native-macOS-${{ matrix.arch }}.zip" --build build-macos
      - name: Package app and platform update payload
        run: python tools/package-macos.py --build build-macos --qt "$QT_MAC_ROOT" --output dist-macos --arch ${{ matrix.arch }}
      - name: Record same-run full native build provenance
        if: ${{ inputs.native_run_id == '' }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['GITHUB_SHA'] and len(sha)==40
          proof={'result':'PASS','sourceHeadSha':sha,'currentHeadSha':sha,
                 'sourceRunId':os.environ['GITHUB_RUN_ID'],'nativeCompilationSkipped':False,
                 'nativeSourcesIdentical':True,'qtVersion':'6.11.3',
                 'buildProvenance':'same-run successful native-build dependency',
                 'minimumDeploymentTarget':'15.0'}
          Path('dist-macos/native-source-result.json').write_text(json.dumps(proof,indent=2),encoding='utf-8')
          PY
      - name: Keep validated native source provenance with final evidence
        if: ${{ inputs.native_run_id != '' }}
        run: cp "$RUNNER_TEMP/native-reuse-result.json" dist-macos/native-source-result.json
      - name: Audit candidate bytes and verify complete native payload round trip
        run: |
          python tools/verify-macos.py --app dist-macos/work/portable/TeamHJDLauncher.app --payload dist-macos/TeamHJD-LauncherPayload-macOS-${{ matrix.arch }}.zip --portable dist-macos/TeamHJD-GameTestLauncher-macOS-${{ matrix.arch }}.zip --arch ${{ matrix.cmake_arch }} | tee dist-macos/audit-result.json
          build-macos/LauncherCoreTests --verify-payload dist-macos/TeamHJD-LauncherPayload-macOS-${{ matrix.arch }}.zip "$RUNNER_TEMP/roundtrip"
          python tools/verify-macos-dmg.py --dmg dist-macos/TeamHJD-GameTestLauncher-macOS-${{ matrix.arch }}.dmg --app dist-macos/work/portable/TeamHJDLauncher.app --result dist-macos/dmg-result.json
      - name: Retain audited candidates before delivery acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macOS-candidate-${{ matrix.arch }}
          path: |
            dist-macos/*.zip
            dist-macos/*.dmg
            dist-macos/audit-result.json
            dist-macos/native-source-result.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Verify native bootstrap activation and failed-health rollback
        run: python tools/test-macos-delivery.py --app dist-macos/work/portable/TeamHJDLauncher.app --roundtrip "$RUNNER_TEMP/roundtrip" --arch ${{ matrix.arch }}
      - name: Retain verified public artifacts and acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macOS-${{ matrix.arch }}
          path: |
            dist-macos/*.zip
            dist-macos/*.dmg
            dist-macos/*result.json
            dist-macos/*.png
          if-no-files-found: error
          retention-days: 14
