name: Security and regression checks
on:
  pull_request:
  push:
    branches: [main, codex/security-qt-installer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regressions:
    name: Security regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install fixed server crypto dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Authentication, account fairness and management boundaries
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Public file boundary and pinned release signature
        run: |
          node --check website/app.js
          node --check website/release-feed.js
          node tools/test-release-feed.mjs
          node tools/check-download-site.mjs
      - name: Check the supported SDK is enforced by builds and packaging
        run: |
          python - <<'PY'
          from pathlib import Path
          assert 'find_package(Qt6 6.11.3 EXACT REQUIRED' in Path('CMakeLists.txt').read_text(encoding='utf-8-sig')
          assert '6.11.3' in Path('tools/install-qt-sdk.py').read_text(encoding='utf-8-sig')
          assert '6.8.3' not in Path('.github/workflows/macos-release.yml').read_text(encoding='utf-8-sig')
          PY
